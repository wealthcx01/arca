name: CI

# ARCA-34. Until now this repository had no automated checks at all: `.github/workflows` did not
# exist, and every change was verified by whoever happened to read it. Eleven pieces of work were
# merged on 2026-08-19 with nothing but a human's reading behind them.
#
# Four gates, each one green on `master` the day it was added — a gate that is red from birth gets
# ignored, and an ignored gate is worse than none because it looks like cover.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

# A superseded run is wasted minutes; the newest push is the only one anyone acts on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scoped to what THIS change touched, deliberately. ARCA's own code currently carries ~198 biome
    # errors of accumulated debt (ARCA-65) — blocking on all of it would stop every PR on day one
    # and the gate would be switched off within a week. Holding new code clean while the debt is
    # worked down separately is the version of this that survives contact with a real backlog.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --since needs the base branch's history, not a shallow clone
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # `--no-errors-on-unmatched` is load-bearing, not tidiness: biome exits 1 when it processes no
      # files, and a ticket-only change touches nothing it lints. Without it every ticket the
      # composer files would fail lint for having no code in it.
      - name: Lint the files this change touches
        run: >-
          bunx biome check --changed
          --since=origin/${{ github.base_ref || 'master' }}
          --no-errors-on-unmatched .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The client is a separate workspace with its own package.json and lockfile. Installing only
      # at the root leaves vite, @vitejs/plugin-react and the JSX types missing — which passes on a
      # machine where client/node_modules already exists and fails on every clean checkout.
      - name: Install client dependencies
        run: cd client && bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The suite talks to SQLite, so it needs the tables to exist. It does NOT need the catalog:
      # tests that depend on data bring their own and clean up after themselves (ARCA-34), which is
      # what lets them run here at all. `db:seed` is deliberately not called — it reaches out to the
      # Pokemon TCG API, and a gate that fails when someone else's service is slow is not a gate.
      - name: Create the database schema
        run: bun run db:push
      - run: bun test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The client is a separate workspace with its own package.json and lockfile. Installing only
      # at the root leaves vite, @vitejs/plugin-react and the JSX types missing — which passes on a
      # machine where client/node_modules already exists and fails on every clean checkout.
      - name: Install client dependencies
        run: cd client && bun install --frozen-lockfile
      - run: bun run build

  e2e:
    name: Browser suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ARCA-66. The .pw.ts suite existed since ARCA-50 and had never run anywhere but a developer's
    # machine, because it needs three things at once: a populated catalog, a running stack, and a
    # browser. Each is arranged here, and none of them reaches the network.
    env:
      # Throwaway, and only ever used by this job. Real values live on the deployment.
      BETTER_AUTH_SECRET: ci-only-not-a-real-secret-value-000000
      ARCA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install client dependencies
        run: cd client && bun install --frozen-lockfile

      # Cache the browser on the resolved Playwright version. No `--with-deps`: that shells out to
      # apt, which hung the studio's own UI gate for six hours and then failed it at eight minutes
      # on an unreachable mirror. The runner already carries chromium's libraries.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(cd client && node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}-chromium
      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: cd client && bunx playwright install chromium

      # The catalog, offline. `db:seed` would work and calls the Pokémon TCG API — a gate that fails
      # when someone else's service is slow is not a gate.
      - name: Create the schema and load the catalog fixture
        run: |
          bun run db:push
          bun run scripts/seed-fixture.ts

      - name: Start the stack
        run: |
          PORT=3001 bun server.ts > /tmp/arca-server.log 2>&1 &
          (cd client && bunx vite --port 5173 > /tmp/arca-client.log 2>&1 &)

      # Wait for readiness rather than sleeping: a fixed sleep is either too short on a slow runner
      # or wasted on a fast one, and its failure mode is a browser test that reads as a product bug.
      - name: Wait for the stack to answer
        timeout-minutes: 3
        run: |
          for url in http://localhost:3001/api/cards?limit=1 http://localhost:5173/ http://localhost:5173/fixture-card.svg; do
            echo "waiting for $url"
            until curl -fsS -o /dev/null --max-time 5 "$url"; do sleep 2; done
            echo "  ok"
          done

      - name: Run the browser suite
        timeout-minutes: 8
        run: cd client && bunx playwright test --config ./playwright.config.ts --reporter=line

      # Screenshots and the report on failure, so a red run can be read without reproducing it.
      - name: Upload screenshots and report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-suite-artifacts
          path: |
            client/test-results/
            client/playwright-report/
          if-no-files-found: ignore
      - name: Server logs on failure
        if: failure()
        run: tail -50 /tmp/arca-server.log /tmp/arca-client.log || true
