<script>
////////////////////////////////////////////////////////////////////////////////

// The reference of various UI objects
var $backdrop;
var $loginform;
var $button_login;
var $input_uid;
var $input_pwd;

////////////////////////////////////////////////////////////////////////////////

// Initialization starts here...
$(function() {
    // Save the reference of various UI objects
    $backdrop = $("#backdrop");
    $loginform = $("#loginform");
    $button_login = $("#button_login");
    $input_uid = $("#input_uid.inputbox input");
    $input_pwd = $("#input_pwd.inputbox input");

    // The login action~~
    $button_login.toolbutton({
        click: function(id) {
            $loginform.submit();
        }
    });

    $input_uid.keypress(function(event) {
        if (event.which == 13) {
            event.preventDefault();
            $input_pwd.focus();
        }
    })
    .focus(function() {
        this.select();
    });

    $input_pwd.keypress(function(event) {
        if (event.which == 13) {
            event.preventDefault();
            $button_login.click();
        }
    })
    .focus(function() {
        this.select();
    });

    // When the window size is changed...
    $window.bind(_RESIZE_EVENT, relayout);
    relayout();

    // Show the login form
    $loginform.show();
});

function relayout() {
    var x = parseInt(($window.innerWidth() - $backdrop.width()) / 2);
    var y = parseInt(($window.innerHeight() - $backdrop.height()) / 2);
    $backdrop.css({ left:x, top:y });
}

////////////////////////////////////////////////////////////////////////////////

// Set UI language now...
var lang = _DEFAULT_APPLANG;
$(function() {
    $loginform.find("[name='lang']").attr("value", lang);

    $button_login.children("span").html(RESOURCEBUNDLE[lang].buttonlogin_label);
    $input_uid.attr("_placeholder", RESOURCEBUNDLE[lang].inputuid_placeholder).setinputplaceholder();
    $input_pwd.attr("_placeholder", RESOURCEBUNDLE[lang].inputpwd_placeholder).setinputplaceholder();
});

var RESOURCEBUNDLE = {
    "ja": {
        inputuid_placeholder: "ユーザー名",
        inputpwd_placeholder: "パスワード",
        buttonlogin_label: "ログイン",
        errmsg: {
            "s1": "セッションのタイムアウトが発生しました。",
            "l1": "ユーザーIDまたはパスワードが無効です。再度確認してください。",
            "l2": "ユーザーIDまたはパスワードが無効です。再度確認してください",
            "l3": "システムエラーが発生しました。再度確認してください。"
        }
    },
    "en": {
        inputuid_placeholder: "Username",
        inputpwd_placeholder: "Password",
        buttonlogin_label: "Login",
        errmsg: {
            "s1": "Session timeout",
            "l1": "Invalid username or password",
            "l2": "Account inactive",
            "l3": "System error"
        }
    }
};



function onsubmitloginform() {
    var version = $loginform.find("[name='version']").val();
    if (version == "") version = "default";
    if (_LOGIN_TARGET_MAP[version]==null) version = "default";
    var actionpath = _LOGIN_TARGET_MAP[version];
    if (version != "default") actionpath += "?version=" + version;
    $loginform.attr("action", actionpath);
    return true;
}

</script>
